services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookshop-net
  backend:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    restart: on-failure
    networks:
      - bookshop-net
  nginx:
    image: nginx:alpine
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - backend
    restart: on-failure
    networks:
      - bookshop-net
volumes:
  postgres_data:
  static_volume:
networks:
  bookshop-net:
    driver: bridge